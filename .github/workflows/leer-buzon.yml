# Lee el buzón de precios fuelfy@fuelfy.app cada 5 minutos y manda los precios a la app.
name: Leer buzón de precios

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: leer-buzon
  cancel-in-progress: false

jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: buzon
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leer el buzón
        env:
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          INGESTA_TOKEN: ${{ secrets.INGESTA_TOKEN }}
        run: python buzon/leer_buzon.py
